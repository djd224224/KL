<title>IMM Pocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f6f6f3;
  --surface: #fcfcfb;
  --surface-2: #efeee9;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #7d7b75;
  --grid: #e3e2db;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --s-net: #2a78d6;
  --s-trade: #eb6834;
  --s-rew: #1baf7a;
  --up: #006300;
  --down: #c0302f;
  --warn-ink: #8a5a00;
  --chip-crit: rgba(208, 59, 59, 0.10);
  --chip-warn: rgba(250, 178, 25, 0.18);
  --chip-info: rgba(42, 120, 214, 0.09);
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.05);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0f0e;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #f4f4f1;
    --ink-2: #c3c2b7;
    --muted: #8e8c85;
    --grid: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #5b9ff0;
    --s-net: #3987e5;
    --s-trade: #d95926;
    --s-rew: #199e70;
    --up: #2fbf4a;
    --down: #f07575;
    --warn-ink: #f2c25a;
    --chip-crit: rgba(230, 103, 103, 0.16);
    --chip-warn: rgba(250, 178, 25, 0.14);
    --chip-info: rgba(57, 135, 229, 0.16);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f0e;
  --surface: #1a1a19;
  --surface-2: #232321;
  --ink: #f4f4f1;
  --ink-2: #c3c2b7;
  --muted: #8e8c85;
  --grid: #2c2c2a;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #5b9ff0;
  --s-net: #3987e5;
  --s-trade: #d95926;
  --s-rew: #199e70;
  --up: #2fbf4a;
  --down: #f07575;
  --warn-ink: #f2c25a;
  --chip-crit: rgba(230, 103, 103, 0.16);
  --chip-warn: rgba(250, 178, 25, 0.14);
  --chip-info: rgba(57, 135, 229, 0.16);
  --shadow: none;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 14px; }
.num, td, .big, .v, .val { font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
.muted { color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding-top: 4px; }
header.top h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.asof { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--chip-info); color: var(--accent); }
.chip.stale { background: var(--chip-warn); color: var(--warn-ink); }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 6px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { font: 500 14px var(--sans); color: var(--ink-2); background: transparent; border: 0; border-radius: 8px; padding: 8px 4px; cursor: pointer; min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button:focus-visible, .frow:focus-visible, .sortseg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; }
.lbl { font-size: 13px; color: var(--ink-2); }
.hero .big { font-size: 40px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; margin-top: 2px; }
.hero .sub { font-size: 13px; color: var(--muted); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--grid); }
.split .k { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.key { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.split .v { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.split .s { font-size: 12px; color: var(--muted); min-height: 1.45em; }
.spark { display: block; width: 100%; height: 28px; margin-top: 4px; }
.cmp { margin-top: 10px; font-size: 13px; color: var(--ink-2); }

.chartcard .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: baseline; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.legend b { font-weight: 600; color: var(--ink); }
.keyline { width: 12px; height: 3px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 5px; }
#curve { margin-top: 8px; }
#curve svg { display: block; width: 100%; }
#curve text { fill: var(--muted); font: 11px var(--sans); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.tile .val { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.tile .val .vs { font-size: 13px; font-weight: 400; color: var(--ink-2); }
.tile .sub, .tile .sub2 { font-size: 12px; color: var(--ink-2); }
.tile .sub2 { color: var(--muted); }
@media (max-width: 360px) { .tiles { grid-template-columns: 1fr; } }

.fhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.fhead h2 { font-size: 17px; font-weight: 600; margin: 0; }
.sortseg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 2px; gap: 2px; }
.sortseg button { font: 500 12px var(--sans); color: var(--ink-2); background: transparent; border: 0; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
.sortseg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.tw { overflow-x: auto; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td { text-align: right; padding: 9px 4px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td:first-child { white-space: normal; }
tr.frow { cursor: pointer; }
tr.frow:hover td { background: var(--surface-2); }
tr.frow td:first-child::before { content: "\25B8"; color: var(--muted); display: inline-block; width: 14px; transition: transform 0.15s; }
tr.frow[aria-expanded="true"] td:first-child::before { transform: rotate(90deg); }
td.net { font-weight: 600; }
tr.tot td { font-weight: 600; border-bottom: 0; border-top: 2px solid var(--grid); }
tr.det td { background: var(--surface-2); padding: 10px 12px; text-align: left; white-space: normal; }
.dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; font-size: 13px; }
.dl div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--grid); padding-bottom: 3px; }
.dl dt { color: var(--ink-2); }
.dl dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; }
.tag.crit { background: var(--chip-crit); color: var(--down); }
.tag.warn { background: var(--chip-warn); color: var(--warn-ink); }
footer { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>IMM Pocket</h1>
    <div class="asof"><span id="asof"></span><span id="fresh" class="chip"></span></div>
  </header>
  <div class="tabs"><div class="seg" id="seg" role="group" aria-label="Time window"></div></div>

  <section class="card hero" id="hero" aria-live="polite"></section>

  <section class="card chartcard">
    <div class="head"><div class="lbl" id="curveTitle">Cumulative</div><div class="legend" id="legend"></div></div>
    <div id="curve"></div>
  </section>

  <section class="tiles" id="tiles"></section>

  <section class="card" aria-labelledby="famTitle">
    <div class="fhead">
      <h2 id="famTitle">Families</h2>
      <div class="sortseg" id="sortseg" role="group" aria-label="Sort families"></div>
    </div>
    <p class="note" id="famNote"></p>
    <div class="tw"><table id="fams"></table></div>
  </section>

  <footer>
    <div id="foot"></div>
    <div>Modeled rewards are the bot's own estimate, before Kalshi's $1-per-market floor. Trading P&amp;L is mark-to-market on the bot's book at Kalshi mids. Quoting, inventory and halts show the book at the snapshot.</div>
  </footer>
</div>

<script>
// The build embedded at publish; a newer one arrives from the page's database
// (pocket/latest), which a scheduled Claude task rewrites every 30 minutes.
let M = /*__POCKET_DATA__*/null;
let SRC = "embedded";
const STALE_MIN = 45;
const WK = ["today", "yesterday", "24h", "7d"];
const WL = { today: "Today", yesterday: "Yesterday", "24h": "24h", "7d": "7 days" };
const MINUS = "−";
const $ = (id) => document.getElementById(id);
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ESC[c]);
const num = (v) => (typeof v === "number" && isFinite(v)) ? v : 0;
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } return null; }

function fmtUSD(v, sign) {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a < 0.005) return "$0.00";
  const body = a >= 100 ? Math.round(a).toLocaleString("en-US") : a.toFixed(2);
  return (v < 0 ? MINUS : (sign ? "+" : "")) + "$" + body;
}
function fmtN(v) { return Math.round(num(v)).toLocaleString("en-US"); }
function fmtC(v) {
  if (v == null || !isFinite(v)) return "—";
  const r = Math.round(v * 10) / 10, a = Math.abs(r);
  return (r < 0 ? MINUS : r > 0 ? "+" : "") + (a % 1 === 0 ? a.toFixed(0) : a.toFixed(1)) + "¢";
}
const cls = (v) => v > 0.005 ? "up" : (v < -0.005 ? "down" : "");
const money = (v) => '<span class="' + cls(v) + '">' + fmtUSD(v, true) + "</span>";
const per = (v, n) => n > 0 ? fmtC(v / n * 100) : "—";
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ET_T = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" });
const ET_DT = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const ET_H = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric" });
const ET_D = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", month: "short", day: "numeric" });

let W = (() => {
  const h = (location.hash || "").slice(1);
  if (WK.includes(h)) return h;
  const s = store("pocket.win");
  return WK.includes(s) ? s : "today";
})();
let SORT = store("pocket.sort") || "worst";
const OPEN = new Set();

function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400 * 2) return (Math.round(s / 360) / 10) + " h ago";
  return Math.round(s / 86400) + " days ago";
}
function renderHead() {
  $("asof").textContent = "Data as of " + ET_DT.format(new Date(M.generated * 1000)) + " ET · " + ago(M.generated);
  const old = Date.now() / 1000 - M.generated > STALE_MIN * 60;
  const f = $("fresh");
  f.textContent = old ? (SRC === "live" ? "Stale" : "Snapshot") : (SRC === "live" ? "Live" : "Fresh");
  f.className = "chip" + (old ? " stale" : "");
  f.title = old
    ? (SRC === "live" ? "No refresh in the last " + STALE_MIN + " minutes; the scheduled update may have stopped (it runs while the Claude app is open on the PC)."
      : "The copy built into this page; newer numbers load when the page's live data is available.")
    : (SRC === "live" ? "Refreshed every 30 minutes from the 10-minute dashboard build." : "Built within the last " + STALE_MIN + " minutes.");
  $("seg").innerHTML = WK.filter((k) => M.windows[k]).map((k) =>
    '<button type="button" data-w="' + k + '" aria-pressed="' + (k === W) + '">' + WL[k] + "</button>").join("");
}

function spark(vals, color) {
  const v = vals.map((x) => (x == null ? null : num(x)));
  const pts = v.map((x, i) => [i, x]).filter((p) => p[1] != null);
  if (pts.length < 2) return "";
  const lo = Math.min(...pts.map((p) => p[1])), hi = Math.max(...pts.map((p) => p[1]));
  const w = 100, h = 28, n = v.length - 1 || 1;
  const X = (i) => 2 + i / n * (w - 4), Y = (y) => hi === lo ? h / 2 : h - 3 - (y - lo) / (hi - lo) * (h - 6);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.5" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + X(last[0]).toFixed(1) + '" cy="' + Y(last[1]).toFixed(1) + '" r="2.2" fill="' + color + '"/></svg>';
}

function renderHero() {
  const w = M.windows[W], t = w.tot, na = w.pnl_na;
  const hist = M.history || [];
  let proj = '<div class="s">&nbsp;</div>';
  if (W === "today") {
    const p = M.proj || {};
    proj = p.rest == null ? '<div class="s">projected full day n/a</div>'
      : '<div class="s" title="Modeled rewards so far plus the bot\'s projection to midnight ET if the book holds">projected full day ' + fmtUSD(t.rew + p.rest) + "</div>";
  }
  let cmp = "";
  if (W === "today" && M.ystd) {
    const y = M.ystd;
    cmp = '<div class="cmp">At this time yesterday: net ' + money(y.rew + y.pnl) + " (rewards " + fmtUSD(y.rew) + ", trading " + fmtUSD(y.pnl, true) + ")</div>";
  }
  $("hero").innerHTML =
    '<div class="lbl">Net · ' + esc(w.desc) + "</div>" +
    '<div class="big ' + (na ? "" : cls(t.net)) + '">' + (na ? "n/a" : fmtUSD(t.net, true)) + "</div>" +
    '<div class="sub">Modeled rewards plus mark-to-market trading P&amp;L</div>' +
    '<div class="split">' +
      '<div><div class="k"><i class="key" style="background:var(--s-rew)"></i>Modeled rewards</div><div class="v">' + fmtUSD(t.rew) + "</div>" + proj +
        spark(hist.map((r) => r.rew), css("--s-rew")) + "</div>" +
      '<div><div class="k"><i class="key" style="background:var(--s-trade)"></i>Trading P&amp;L</div><div class="v ' + (na ? "" : cls(t.pnl)) + '">' + (na ? "n/a" : fmtUSD(t.pnl, true)) + "</div>" +
        '<div class="s">realized ' + fmtUSD(t.real, true) + " · marks " + fmtUSD(t.du, true) + "</div>" +
        spark(hist.map((r) => r.pnl), css("--s-trade")) + "</div>" +
    "</div>" + cmp;
}

function niceStep(span, n) {
  const raw = span / Math.max(1, n), p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}
function renderCurve() {
  const w = M.windows[W], pts = M.curves[W] || [], na = w.pnl_na;
  $("curveTitle").textContent = "Cumulative · " + w.desc;
  const series = [
    { name: "Net", color: css("--s-net"), y: (p) => na ? null : p[1] + p[2], wdt: 2.5 },
    { name: "Trading", color: css("--s-trade"), y: (p) => na ? null : p[2], wdt: 1.6 },
    { name: "Rewards", color: css("--s-rew"), y: (p) => p[1], wdt: 1.6 },
  ];
  const lp = pts[pts.length - 1] || [0, 0, 0];
  $("legend").innerHTML = series.map((s, i) => '<span><i class="keyline" style="background:' + s.color + '"></i>' + s.name + " <b>" +
    (i < 2 && na ? "n/a" : fmtUSD(s.y(lp), i < 2)) + "</b></span>").join("");
  const host = $("curve");
  const W0 = Math.max(260, host.clientWidth || 320), H = 190, L = 46, R = 8, T = 8, B = 22;
  if (pts.length < 2) { host.innerHTML = '<p class="note">No curve for this window.</p>'; return; }
  let lo = 0, hi = 0;
  for (const p of pts) for (const s of series) { const v = s.y(p); if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
  if (hi === lo) hi = lo + 1;
  const st = niceStep(hi - lo, 4);
  lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
  const x0 = w.start, x1 = Math.max(w.end, pts[pts.length - 1][0]);
  const X = (t) => L + (t - x0) / (x1 - x0) * (W0 - L - R);
  const Y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = "";
  for (let v = lo; v <= hi + st / 2; v += st) {
    const y = Y(v).toFixed(1);
    g += '<line x1="' + L + '" x2="' + (W0 - R) + '" y1="' + y + '" y2="' + y + '" stroke="' + css(Math.abs(v) < st / 2 ? "--muted" : "--grid") + '" stroke-width="1"' + (Math.abs(v) < st / 2 ? ' stroke-dasharray="3 3"' : "") + "/>";
    g += '<text x="' + (L - 6) + '" y="' + (+y + 4) + '" text-anchor="end">' + (v < 0 ? MINUS : "") + "$" + Math.abs(v).toLocaleString("en-US") + "</text>";
  }
  // x ticks: every 3h within a day, every day across days
  const span = x1 - x0, ticks = [];
  if (span <= 36 * 3600) {
    const stepH = span <= 13 * 3600 ? 2 : span <= 26 * 3600 ? 4 : 6;
    for (let t = Math.ceil(x0 / 3600) * 3600; t <= x1; t += 3600) {
      const h = +new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", hourCycle: "h23" }).format(new Date(t * 1000));
      if (h % stepH === 0) ticks.push([t, ET_H.format(new Date(t * 1000)).replace(" ", " ")]);
    }
  } else {
    for (let t = Math.ceil(x0 / 3600) * 3600; t <= x1; t += 3600) {
      const h = +new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", hourCycle: "h23" }).format(new Date(t * 1000));
      if (h === 0) ticks.push([t, ET_D.format(new Date(t * 1000))]);
    }
  }
  const minGap = 46;
  let lastX = -1e9;
  for (const [t, lab] of ticks) {
    const x = X(t);
    if (x - lastX < minGap || x > W0 - R - 14) continue;
    lastX = x;
    g += '<text x="' + x.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(lab) + "</text>";
  }
  let paths = "";
  for (const s of series.slice().reverse()) {
    let d = "";
    for (const p of pts) { const v = s.y(p); if (v == null) continue; d += (d ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(v).toFixed(1); }
    if (d) paths += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' + s.wdt + '" stroke-linejoin="round"/>';
    const v = s.y(lp);
    if (v != null) paths += '<circle cx="' + X(lp[0]).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="3" fill="' + s.color + '"/>';
  }
  host.innerHTML = '<svg viewBox="0 0 ' + W0 + " " + H + '" height="' + H + '" role="img" aria-label="Cumulative net, trading P&amp;L and modeled rewards through the window">' + g + paths + "</svg>";
}

function renderTiles() {
  const t = M.windows[W].tot, h = M.halts;
  const nh = h.side + h.event + h.depth;
  const tiles = [
    { lbl: "Fills", val: fmtN(t.fills), sub: fmtN(t.cts) + " contracts · " + fmtUSD(t.usd) + " traded",
      sub2: t.mk_n ? "30m mark-out " + money(t.mk) + " · per contract: edge " + per(t.fe, t.fe_cts) + ", 30m " + per(t.mk, t.mk_cts) + ", to date " + per(t.mt, t.mt_cts) : "mark-outs pending" },
    { lbl: "Quoting now", val: fmtN(t.q2 + t.q1) + ' mkts <span class="vs">in ' + fmtN(t.qev) + " events</span>",
      sub: fmtN(t.q2) + " two-sided · " + fmtN(t.q1) + " one-sided · " + fmtN(t.held) + " held",
      sub2: fmtUSD(t.restNow) + " resting · yield " + (t.yield_c != null ? t.yield_c.toFixed(1) + "¢ per $1 per day" : "—") },
    { lbl: "Open inventory", val: '<span class="' + cls(t.u) + '">' + fmtUSD(t.u, true) + "</span>", sub: fmtN(t.npos) + " positions · " + fmtUSD(t.risk) + " at cost",
      sub2: "worst case to settlement " + money(M.book_wc) + " (netted per event)" },
    { lbl: "Halts & guards", val: nh + (nh === 1 ? " halt" : " halts"), sub: h.side + " toxic side · " + h.event + " toxic event · " + h.depth + " mention-gate",
      sub2: h.guards + " markets guard-held (" + h.risk_guards + " risk guards)" },
  ];
  $("tiles").innerHTML = tiles.map((x) => '<div class="card tile"><div class="lbl">' + x.lbl + '</div><div class="val">' + x.val + '</div><div class="sub">' + x.sub + '</div><div class="sub2">' + x.sub2 + "</div></div>").join("");
}

const SORTS = { worst: ["Worst first", (a, b) => a.net - b.net], best: ["Best first", (a, b) => b.net - a.net], rew: ["Rewards", (a, b) => b.rew - a.rew] };
function covCell(r) {
  if (r.cov == null) return r.fills && r.nf > 0.005 ? "new fills made money" : "—";
  const s = r.cov >= 10 ? "≥10×" : r.cov.toFixed(1) + "×";
  return r.cov < 1 ? '<span class="tag crit">' + s + "</span>" : r.cov < 2 ? '<span class="tag warn">' + s + "</span>" : s;
}
function detail(r, w) {
  const na = w.pnl_na, yest = W === "yesterday";
  const items = [
    ["New fills", na ? "n/a" : money(r.nf)],
    ["Carry: marks", na ? "n/a" : money(r.cr)],
    ["Carry: settled", na ? "n/a" : money(r.cs)],
    ["Fills", fmtN(r.fills) + (r.cts ? " · " + fmtN(r.cts) + " cts" : "")],
    ["Mark-out 30m", r.mk_cts > 0 ? money(r.mk) + " · " + per(r.mk, r.mk_cts) + "/ct" : "—"],
    ["Edge at fill", r.fe_cts > 0 ? per(r.fe, r.fe_cts) + "/ct" : "—"],
    ["Mark-out to date", r.mt_cts > 0 ? money(r.mt) + " · " + per(r.mt, r.mt_cts) + "/ct" : "—"],
    ["Coverage", covCell(r)],
    [yest ? "Worst case (at close)" : "Worst case (now)", Math.abs(r.wc) >= 0.005 ? money(r.wc) : "—"],
    ["Quoting now", fmtN(r.q) + " mkts" + (r.held ? " · " + r.held + " held" : "")],
    ["Est $/day now", r.est ? fmtUSD(r.est) : "—"],
    ["Exp. net/day", (r.est || r.npos || r.q) ? money(r.exp) : "—"],
    ["Typical full day (7d)", r.typ != null ? money(r.typ) : "—"],
  ];
  if (r.nset) items.push(["Settled in window", r.nset + " mkts · " + fmtUSD(r.pset, true)]);
  return '<dl class="dl">' + items.map((x) => "<div><dt>" + x[0] + "</dt><dd>" + x[1] + "</dd></div>").join("") + "</dl>";
}
function renderFams() {
  const w = M.windows[W], na = w.pnl_na;
  $("sortseg").innerHTML = Object.keys(SORTS).map((k) => '<button type="button" data-s="' + k + '" aria-pressed="' + (k === SORT) + '">' + SORTS[k][0] + "</button>").join("");
  const rows = w.fams.slice().sort(SORTS[SORT][1]);
  $("famNote").textContent = "Trading P&L = the window's new fills + inventory carried in. Tap a family for the split, mark-outs and worst case.";
  let h = '<thead><tr><th scope="col">Family</th><th scope="col">Net</th><th scope="col">Rewards</th><th scope="col">Trading</th></tr></thead><tbody>';
  for (const r of rows) {
    const open = OPEN.has(r.name);
    h += '<tr class="frow" tabindex="0" data-f="' + esc(r.name) + '" aria-expanded="' + open + '"><td>' + esc(r.name) + "</td>" +
      '<td class="net">' + (na ? "n/a" : money(r.net)) + "</td><td>" + fmtUSD(r.rew) + "</td><td>" + (na ? "n/a" : money(r.pnl)) + "</td></tr>";
    if (open) h += '<tr class="det"><td colspan="4">' + detail(r, w) + "</td></tr>";
  }
  const t = w.tot;
  h += '<tr class="tot"><td>All families</td><td class="net">' + (na ? "n/a" : money(t.net)) + "</td><td>" + fmtUSD(t.rew) + "</td><td>" + (na ? "n/a" : money(t.pnl)) + "</td></tr></tbody>";
  $("fams").innerHTML = h;
}

function renderAll() {
  renderHead(); renderHero(); renderCurve(); renderTiles(); renderFams();
  $("foot").textContent = "From the IMM dashboard build of " + ET_DT.format(new Date(M.generated * 1000)) + " ET (" +
    (SRC === "live" ? "live: refreshed every 30 minutes" : "the copy built into this page") + "). Windows are ET days.";
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("#seg button");
  if (b) { W = b.dataset.w; store("pocket.win", W); try { history.replaceState(null, "", "#" + W); } catch (x) { /* sandboxed */ } renderAll(); return; }
  const s = e.target.closest("#sortseg button");
  if (s) { SORT = s.dataset.s; store("pocket.sort", SORT); renderFams(); return; }
  const r = e.target.closest("tr.frow");
  if (r) { const f = r.dataset.f; if (OPEN.has(f)) OPEN.delete(f); else OPEN.add(f); renderFams(); }
});
document.addEventListener("keydown", (e) => {
  const r = e.target.closest && e.target.closest("tr.frow");
  if (r && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    const f = r.dataset.f;
    if (OPEN.has(f)) OPEN.delete(f); else OPEN.add(f);
    renderFams();
    const again = document.querySelector('tr.frow[data-f="' + CSS.escape(f) + '"]');
    if (again) again.focus();
  }
});
let rz = 0;
window.addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(renderCurve); });
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", renderAll);
}
new MutationObserver(renderAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
setInterval(() => { if (M) renderHead(); }, 60000);
if (M) renderAll();

// live numbers: the newest build in pocket/latest replaces the embedded copy
(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) return;
  db.doc("pocket/latest").onSnapshot((snap) => {
    if (!snap.exists) return;
    const d = snap.data();
    if (!d || !d.windows || !d.curves || typeof d.generated !== "number") return;
    if (M && d.generated < M.generated) return;
    M = d;
    SRC = "live";
    if (!M.windows[W]) W = "today";
    renderAll();
  }, () => { /* keep the copy on screen */ });
})();
</script>
