name: Test Alert Delivery
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Test email/SMS alert
      env:
        ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      run: |
        python3 -c "
        import os, smtplib
        from email.mime.text import MIMEText
        from datetime import datetime, timezone

        msg = MIMEText('KXMLBMENTION alert test. If you see this, alerting works.')
        msg['Subject'] = 'MLB Bot: Test Alert'
        msg['From'] = os.environ['ALERT_EMAIL_FROM']
        msg['To'] = os.environ['ALERT_EMAIL_TO']

        with smtplib.SMTP_SSL('smtp.gmail.com', 465, timeout=15) as s:
            s.login(os.environ['ALERT_EMAIL_FROM'], os.environ['ALERT_EMAIL_PASSWORD'])
            s.sendmail(msg['From'], [msg['To']], msg.as_string())

        print('Sent successfully')
        "
