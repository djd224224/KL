name: NCAABMENTION v4.2-NCAAB Trading Bot
# Runs every 2 hours (offset by 5 min to avoid overlap with NBA bot)
# Times in UTC: 0:05, 2:05, 4:05, 6:05, 8:05, 10:05, 12:05, 14:05, 16:05, 18:05, 20:05, 22:05
on:
  schedule:
    - cron: '5 */2 * * *'
  workflow_dispatch:  # Manual trigger
jobs:
  run-trading-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          pandas \
          requests \
          cryptography \
          google-auth \
          google-cloud-bigquery \
          pandas-gbq \
          pyarrow \
          scipy \
          pytz
    - name: Write Kalshi private key
      run: |
        echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > kalshi_private_key.pem
        chmod 600 kalshi_private_key.pem
    - name: Write GCP service account key
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      run: |
        printenv GCP_SA_KEY > gcp_sa_key.json
    - name: Run trading script
      env:
        KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
        KALSHI_PRIVATE_KEY_PATH: kalshi_private_key.pem
        GOOGLE_APPLICATION_CREDENTIALS: gcp_sa_key.json
        GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        GCP_DATASET_ID: ${{ secrets.GCP_DATASET_ID }}
      run: python ncaab_order_script_v42.py
    - name: Cleanup secrets
      if: always()
      run: |
        rm -f kalshi_private_key.pem gcp_sa_key.json
