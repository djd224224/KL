name: KXHIGH orderbook logger
# Triggered externally by cron-job.org (see notes/CRON_EXTERNAL.md if it exists)
# hitting the workflow_dispatch endpoint every 15 min. The previous in-repo
# `schedule:` cron drifted to ~1 run/2h under load; an external scheduler
# fires reliably while still using GitHub-hosted runners.
on:
  workflow_dispatch:
jobs:
  log-orderbook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests cryptography google-auth google-cloud-bigquery google-cloud-storage db-dtypes pyarrow pytz
      - name: Write Kalshi private key
        run: |
          echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > kalshi_private_key.pem
          chmod 600 kalshi_private_key.pem
      - name: Write GCP service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          printenv GCP_SA_KEY > gcp_sa_key.json
      - name: Run orderbook logger
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PATH: kalshi_private_key.pem
          GOOGLE_APPLICATION_CREDENTIALS: gcp_sa_key.json
          BQ_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET: ${{ secrets.GCP_DATASET_ID }}
        run: python kxhigh_orderbook_logger.py
      # Keep the analysis views in sync BEFORE rendering. They are
      # CREATE OR REPLACE VIEW DDLs (settlements_clean, model_call_snapshots,
      # resolved_markets, fills/orders_clean, fills_enriched, orders_fills)
      # that nothing else maintains; a base-table drop/recreate leaves them
      # broken, which silently breaks the dashboard ("unsettled") and the
      # bias correction. Idempotent, ~1s metadata ops — safe every tick.
      - name: Build analysis views
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp_sa_key.json
        run: python analysis/kxhigh/python/build_views.py
      # Re-render the live dashboard right after the orderbook poll so the
      # HTML reflects the freshest state. Reads only — same SA, same auth.
      - name: Build live dashboard
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp_sa_key.json
        run: python analysis/kxhigh/python/live_dashboard.py
      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kxhigh-live-dashboard
          path: analysis/kxhigh/output/live_dashboard.html
          retention-days: 7
      - name: Cleanup secrets
        if: always()
        run: |
          rm -f kalshi_private_key.pem gcp_sa_key.json
