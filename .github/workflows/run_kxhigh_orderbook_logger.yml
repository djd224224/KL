name: KXHIGH orderbook logger
on:
  schedule:
    # Every 15 minutes — captures price-path granularity needed for the
    # increment-tuning and cancel-time analyses (see kxhigh_orderbook_logger.py
    # docstring). 96 polls/day × ~240 markets ≈ 23k rows/day.
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  log-orderbook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests cryptography google-auth google-cloud-bigquery db-dtypes pyarrow pytz
      - name: Write Kalshi private key
        run: |
          echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > kalshi_private_key.pem
          chmod 600 kalshi_private_key.pem
      - name: Write GCP service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          printenv GCP_SA_KEY > gcp_sa_key.json
      - name: Run orderbook logger
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PATH: kalshi_private_key.pem
          GOOGLE_APPLICATION_CREDENTIALS: gcp_sa_key.json
          BQ_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET: ${{ secrets.GCP_DATASET_ID }}
        run: python kxhigh_orderbook_logger.py
      - name: Cleanup secrets
        if: always()
        run: |
          rm -f kalshi_private_key.pem gcp_sa_key.json
