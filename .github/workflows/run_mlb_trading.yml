name: MLBMENTION Trading Bot
# Runs every 3 hours (offset by 2 min to avoid top-of-hour congestion)
# 8 runs/day
on:
  schedule:
    - cron: '2 */2 * * *'
  workflow_dispatch:  # Manual trigger
jobs:
  run-trading-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          pandas \
          requests \
          cryptography \
          google-auth \
          google-cloud-bigquery \
          pandas-gbq \
          pyarrow \
          scipy \
          pytz
    - name: Write Kalshi private key
      run: |
        echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > kalshi_private_key.pem
        chmod 600 kalshi_private_key.pem
    - name: Write GCP service account key
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      run: |
        printenv GCP_SA_KEY > gcp_sa_key.json
    - name: Run trading script
      id: run_script
      env:
        KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
        KALSHI_PRIVATE_KEY_PATH: kalshi_private_key.pem
        GOOGLE_APPLICATION_CREDENTIALS: gcp_sa_key.json
        GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        GCP_DATASET_ID: ${{ secrets.GCP_DATASET_ID }}
        ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        ALERT_EMAIL_TO: jackdu224@gmail.com  # tmomail SMS gateway dead since 2026-06-29 -> deliver to inbox (Gmail push)
      run: |
        set -o pipefail
        python mlb_trading.py 2>&1 | tee run.log
    - name: Publish run summary
      if: always()
      env:
        JOB_STATUS: ${{ steps.run_script.outcome }}
      run: |
        {
          echo "*Outcome: \`$JOB_STATUS\`*"
          echo ""
          if [ -f run_summary.md ]; then
            cat run_summary.md
          else
            echo "_run_summary.md not produced — script may have failed early. See logs._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload run summary artifact
      if: always() && hashFiles('run_summary.md') != ''
      uses: actions/upload-artifact@v4
      with:
        name: mlb-run-summary-${{ github.run_id }}
        path: run_summary.md
        retention-days: 30
    - name: Cleanup secrets
      if: always()
      run: |
        rm -f kalshi_private_key.pem gcp_sa_key.json run.log run_summary.md
