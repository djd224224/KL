name: Longshot Trading

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  run-kalshi-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography python-dateutil
      - name: Write Kalshi private key
        run: |
          echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > kalshi_private_key.pem
          chmod 600 kalshi_private_key.pem
      - name: Run Kalshi script
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PATH: kalshi_private_key.pem
        run: python kalshi_longshot_bot.py
      - name: Cleanup secrets
        if: always()
        run: |
          rm -f kalshi_private_key.pem
