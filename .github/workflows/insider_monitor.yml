name: Kalshi Insider Monitor

on:
  schedule:
    - cron: '*/3 10-23 * * *'   # UTC 10:00-23:59 (6am-8pm ET)
    - cron: '*/3 0-6 * * *'     # UTC 00:00-06:00 (8pm-2am ET)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Diagnostic mode (leave blank for normal monitoring)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - calibrate
          - list-markets

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cryptography google-cloud-bigquery

      - name: Write GCP credentials
        run: printenv GCP_CREDENTIALS_JSON > /tmp/gcp_creds.json
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Write Kalshi private key
        run: printenv KALSHI_PRIVATE_KEY > kalshi_private_key.pem
        env:
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}

      - name: Run insider monitor
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "calibrate" ]; then
            python kalshi_insider_monitor.py --calibrate
          elif [ "$MODE" = "list-markets" ]; then
            python kalshi_insider_monitor.py --list-markets
          else
            python kalshi_insider_monitor.py
          fi
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_PRIVATE_KEY_PATH: kalshi_private_key.pem
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_creds.json
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_TO: jackdu224@gmail.com  # tmomail SMS gateway dead since 2026-06-29 -> deliver to inbox (Gmail push)

      - name: Cleanup secrets
        if: always()
        run: rm -f /tmp/gcp_creds.json kalshi_private_key.pem
