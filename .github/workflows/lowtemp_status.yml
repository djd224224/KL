name: Low-temp status
# On-demand status probe for the KXLOW bot: current activity + settled P&L
# aggregates since it went live. Read-only against Kalshi. Push-triggered
# (the GitHub App integration cannot dispatch workflows) — re-run by
# pushing a change to lowtemp_status.trigger. Safe to delete anytime.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - lowtemp_status.py
      - .github/workflows/lowtemp_status.yml
      - lowtemp_status.trigger
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography pytz python-dateutil
      - name: Write Kalshi key
        run: |
          echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > Lisa_Kalshi.txt
      - name: Run status probe
        env:
          IMM_STATUS_DIR: /tmp/imm-status
        run: python lowtemp_status.py
      - name: Cleanup secrets
        if: always()
        run: rm -f Lisa_Kalshi.txt
