name: KXTRUEV diagnostic
# One-shot, dispatch-only: ground truth for "KXTRUEV still not quoting" —
# do markets exist, are any open, and does an active liquidity incentive
# program cover them. Read-only against Kalshi (GETs only, live=False).
# Safe to delete once KXTRUEV is resolved.
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography pytz python-dateutil
      - name: Write Kalshi key
        run: |
          echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > Lisa_Kalshi.txt
      - name: Run diagnostic
        env:
          IMM_STATUS_DIR: /tmp/imm-diag
        run: python kxtruev_diag.py
      - name: Cleanup secrets
        if: always()
        run: rm -f Lisa_Kalshi.txt
