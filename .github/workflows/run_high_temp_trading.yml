name: High temp trading
# Triggered externally by cron-job.org hitting workflow_dispatch.
# Effective firing times (UTC): 01:02, 04:02, 10:02, 12:02 — these match
# what the bot actually saw under GH cron drift, NOT the previous in-repo
# cron values. The 04:02 UTC slot is the 23 CDT evening run; firing earlier
# (e.g. 02:02 UTC = 21 CDT) hits WU's pre-refresh window where
# temperatureMax[0] is null.
#
# One extra slot exists: the west late-morning re-quote (2026-09-29 test),
# intended for 14:07 UTC = 09:07 CDT / 08:07 CST. It only touches
# LAX/SFO/SEA/LV/SD/PHX/DEN and keeps quoting them until 10:05 local.
#
# ---- 2026-10-06: its GitHub `schedule:` trigger was REMOVED. ----
# The original note here assumed "GH cron drift only shortens its window, so
# it does not need cron-job.org precision". That was wrong. All six fires
# between 9/30 and 10/5 landed 3h47m-7h20m late -- 12:54, 13:06, 14:11,
# 14:13, 14:29 and 16:27 CT against a 09:07 CT schedule -- and every one
# exited exit_status='noop' with zero orders. Four were past 14:00 CT, where
# the bot treats a "late" run as an unscheduled evening run and refuses; the
# two earlier ones still missed the west cities' 12:05 CT cutoff. The test
# produced no data at all in a week. Same throttling the kxlow_pause_enforcer
# hit (*/30 cron -> every 2-5h, 13h overnight gap).
#
# TO REVIVE IT (needs the cron-job.org account, Jack):
#   add a cron-job.org job at 14:07 UTC that POSTs this workflow's
#   workflow_dispatch with inputs.run_slot = "west_late", exactly like the
#   four regular slots. Do NOT re-add a `schedule:` block at the same time --
#   both together is a double run.
# Until that job exists the late slot simply does not fire, which is the
# honest state; it is no longer pretending to run four times a week.
# Kill switch (independent of the trigger): repo variable
# KXHIGH_WEST_LATE_ENABLED=false (Settings > Secrets and variables > Actions
# > Variables) -- the late run then exits untouched.
on:
  workflow_dispatch:
    inputs:
      run_slot:
        description: "Empty = slot from the clock. 'west_late' = west late-morning re-quote."
        required: false
        default: ""
jobs:
  run-kalshi-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests cryptography google-cloud-bigquery db-dtypes pyarrow scipy pytz
    - name: Write secrets to disk
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      run: |
        echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > Lisa_Kalshi.txt
        printenv GCP_SA_KEY > google_credentials.json
    - name: Run Kalshi script
      id: run_script
      env:
        ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        ALERT_EMAIL_TO: jackdu224@gmail.com  # tmomail SMS gateway dead since 2026-06-29 -> deliver to inbox (Gmail push)
        GOOGLE_APPLICATION_CREDENTIALS: google_credentials.json
        # ================================================================
        # A/B test: hi_no tied to fair NO (see d80fd4e, analysis/kxhigh/sql/90_ab_hi_no_report.sql)
        # KILLED 2026-08-09 after 1,290 settled markets: no significant
        # treatment edge in any window or robustness cut (headline p≈0.88),
        # the designed bucket-4 mechanism never materialized, and the only
        # significant arm effect was treatment CUTTING fill participation
        # 30.7%→26.3% (p=0.001). 100% control = static per-city hi_no.
        # Machinery kept — re-enable here only with a pre-registered MDE
        # and stop date.
        # ================================================================
        AB_TEST_ENABLED: "false"
        AB_TREATMENT_PROPORTION: "0.5"
        AB_SAFETY_MARGIN_CENTS: "3"
        # West late-morning test (see header). The scheduled trigger is always
        # the late slot; cron-job.org dispatches leave it empty.
        # The `schedule` arm is kept so that re-adding a cron block cannot
        # silently produce an unslotted run, but with no `schedule:` trigger
        # the live path is inputs.run_slot, set by cron-job.org.
        KXHIGH_RUN_SLOT: ${{ github.event_name == 'schedule' && 'west_late' || inputs.run_slot }}
        WEST_LATE_ENABLED: ${{ vars.KXHIGH_WEST_LATE_ENABLED || 'true' }}
        # Morning-slot cap multiplier, ON at 1.5 (Jack 2026-10-06). Morning
        # caps become 150/225/75 for the 100/150/50-cap cities; evening and
        # west_late keep their base caps. The ladder telemetry showed the
        # morning cap refusing 11.8% of wanted contracts in the control arm
        # at +10 to +12c/ct, while the evening cap refuses 44% at +1.45c --
        # which is why this is morning-only and must never go global.
        # Change it any time without a deploy via repo variable
        # KXHIGH_MORNING_CAP_MULT (Settings > Secrets and variables >
        # Actions > Variables); 1.0 reverts.
        MORNING_CAP_MULT: ${{ vars.KXHIGH_MORNING_CAP_MULT || '1.5' }}
      run: |
        set -o pipefail
        python high_temp_trading.py 2>&1 | tee run.log
    - name: Publish run summary
      if: always()
      env:
        JOB_STATUS: ${{ steps.run_script.outcome }}
      run: |
        {
          echo "*Outcome: \`$JOB_STATUS\`*"
          echo ""
          if [ -f run_summary.md ]; then
            cat run_summary.md
          else
            echo "_run_summary.md not produced — script may have failed early. See logs._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload run summary artifact
      if: always() && hashFiles('run_summary.md') != ''
      uses: actions/upload-artifact@v4
      with:
        name: high-temp-run-summary-${{ github.run_id }}
        path: run_summary.md
        retention-days: 30
    - name: Cleanup secrets
      if: always()
      run: |
        rm -f Lisa_Kalshi.txt google_credentials.json run.log run_summary.md
