name: High temp trading
on:
  schedule:
    - cron: '2 0,5,12,13 * * *'
  workflow_dispatch:
jobs:
  run-kalshi-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests cryptography google-cloud-bigquery db-dtypes pyarrow scipy pytz
    - name: Write secrets to disk
      run: |
        echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > Lisa_Kalshi.txt
        echo "${{ secrets.GOOGLE_CREDENTIALS }}" > google_credentials.json
    - name: Run Kalshi script
      env:
        ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      run: python high_temp_trading.py
    - name: Cleanup secrets
      if: always()
      run: |
        rm -f Lisa_Kalshi.txt google_credentials.json
