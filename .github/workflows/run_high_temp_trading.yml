name: High temp trading
on:
  schedule:
    - cron: '2 4,10,11,23 * * *'
  workflow_dispatch:
jobs:
  run-kalshi-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests cryptography google-cloud-bigquery db-dtypes pyarrow scipy pytz
    - name: Write secrets to disk
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      run: |
        echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > Lisa_Kalshi.txt
        printenv GCP_SA_KEY > google_credentials.json
    - name: Run Kalshi script
      id: run_script
      env:
        ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        GOOGLE_APPLICATION_CREDENTIALS: google_credentials.json
        # ================================================================
        # A/B test: hi_no tied to fair NO (see d80fd4e, analysis/kxhigh/sql/90_ab_hi_no_report.sql)
        # Ramp knobs — change values here to advance through the rollout:
        #   Phase 1 (shadow, current):  ENABLED=true, PROPORTION=0.0
        #     100% control, but arm assignment is logged to BQ orders for
        #     infra validation. No actual trading change.
        #   Phase 2 (20%): PROPORTION=0.2
        #   Phase 3 (50%): PROPORTION=0.5
        #   Kill switch:   ENABLED=false (reverts instantly, no redeploy)
        # ================================================================
        AB_TEST_ENABLED: "true"
        AB_TREATMENT_PROPORTION: "0.5"
        AB_SAFETY_MARGIN_CENTS: "3"
      run: |
        set -o pipefail
        python high_temp_trading.py 2>&1 | tee run.log
    - name: Publish run summary
      if: always()
      env:
        JOB_STATUS: ${{ steps.run_script.outcome }}
      run: |
        {
          echo "*Outcome: \`$JOB_STATUS\`*"
          echo ""
          if [ -f run_summary.md ]; then
            cat run_summary.md
          else
            echo "_run_summary.md not produced — script may have failed early. See logs._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload run summary artifact
      if: always() && hashFiles('run_summary.md') != ''
      uses: actions/upload-artifact@v4
      with:
        name: high-temp-run-summary-${{ github.run_id }}
        path: run_summary.md
        retention-days: 30
    - name: Cleanup secrets
      if: always()
      run: |
        rm -f Lisa_Kalshi.txt google_credentials.json run.log run_summary.md
