name: High Temp Trading
on:
  schedule:
    # Every 2 hours from 7:08 PM to 9:08 AM Central Time (CDT=UTC-5)
    # CDT: 7:08p, 9:08p, 11:08p, 1:08a, 3:08a, 5:08a, 7:08a, 9:08a
    # CST: shifts 1hr earlier (6:08p–8:08a) — still within window
    - cron: '8 0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:
jobs:
  run-kalshi-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests cryptography google-auth google-cloud-bigquery db-dtypes pyarrow scipy pytz
      - name: Write Kalshi private key
        run: |
          echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > kalshi_private_key.pem
          chmod 600 kalshi_private_key.pem
      - name: Write GCP service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          printenv GCP_SA_KEY > gcp_sa_key.json
      - name: Run Kalshi script
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PATH: kalshi_private_key.pem
          GOOGLE_APPLICATION_CREDENTIALS: gcp_sa_key.json
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_DATASET_ID: ${{ secrets.GCP_DATASET_ID }}
          WEATHER_UNDERGROUND_KEY: ${{ secrets.WEATHER_UNDERGROUND_KEY }}
          ACCUWEATHER_KEY: ${{ secrets.ACCUWEATHER_KEY }}
        run: python high_temp_trading.py
      - name: Cleanup secrets
        if: always()
        run: |
          rm -f kalshi_private_key.pem gcp_sa_key.json
