name: Low temp trading
# Triggered externally by cron-job.org hitting workflow_dispatch (same
# pattern as "High temp trading" — GH cron drift is too sloppy for the
# timing-sensitive slots).
#
# Recommended trigger times (UTC, CDT = UTC−5):
#   00:02 — 19:02 CT evening run     → trades TOMORROW's lows (main run)
#   03:02 — 22:02 CT late refresh    → trades TOMORROW's lows
#   07:02 — 02:02 CT day-of run      → trades TODAY's lows for CT/MT/PT
#            cities (ET already past its 02:59-local quote stop; 07:02
#            also avoids WU's ~01 CT maintenance window)
#   09:02 — 04:02 CT day-of run      → PT cities only (their 02:59-local
#            stop is 04:59 CT)
#
# Run-mode boundary lives in low_temp_trading.py: runs at/after 08:00 CT
# trade tomorrow's event; 00:00–07:59 CT runs are day-of with obs filters.
# Orders expire at LOCAL midnight of the target day (evening runs) or
# 02:59 local (day-of runs) — never rolled forward.
on:
  workflow_dispatch:
jobs:
  run-kalshi-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests cryptography google-cloud-bigquery db-dtypes pyarrow scipy pytz
    - name: Write secrets to disk
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      run: |
        echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > Lisa_Kalshi.txt
        printenv GCP_SA_KEY > google_credentials.json
    - name: Run Kalshi script
      id: run_script
      env:
        ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        ALERT_EMAIL_TO: jackdu224@gmail.com  # tmomail SMS gateway dead since 2026-06-29 -> deliver to inbox (Gmail push)
        GOOGLE_APPLICATION_CREDENTIALS: google_credentials.json
        # Probe-phase sizing — bump after the first weeks of KXLOW data.
        LOW_STARTING_CONTRACTS: "8"
        LOW_MAX_CONTRACTS: "50"
        # Tails stay off until a low-temp actual-vs-forecast error
        # distribution is built (cold busts are the fat tail for minima).
        TRADE_TAILS: "false"
      run: |
        set -o pipefail
        python low_temp_trading.py 2>&1 | tee run.log
    - name: Publish run summary
      if: always()
      env:
        JOB_STATUS: ${{ steps.run_script.outcome }}
      run: |
        {
          echo "*Outcome: \`$JOB_STATUS\`*"
          echo ""
          if [ -f run_summary.md ]; then
            cat run_summary.md
          else
            echo "_run_summary.md not produced — script may have failed early. See logs._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload run summary artifact
      if: always() && hashFiles('run_summary.md') != ''
      uses: actions/upload-artifact@v4
      with:
        name: low-temp-run-summary-${{ github.run_id }}
        path: run_summary.md
        retention-days: 30
    - name: Cleanup secrets
      if: always()
      run: |
        rm -f Lisa_Kalshi.txt google_credentials.json run.log run_summary.md
