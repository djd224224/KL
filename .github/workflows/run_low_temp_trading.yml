name: Low temp trading
# Scheduled via GH Actions native cron (unlike "High temp trading", which
# is fired by cron-job.org because its morning slots are timing-sensitive
# and GH cron drifts). This bot tolerates GH cron drift by design: order
# expiries are fixed local-clock stops computed in-script (local midnight
# of the target day for evening runs, 02:59 local for day-of runs), so a
# late-firing run just quotes a shorter window, and a run firing past a
# city's stop skips that city outright (never rolls forward).
#
# Slots (UTC; CT = UTC−5 in summer, −6 in winter). Minutes chosen
# off-peak — :00/:02 is GH's most congested and most-drifted window.
#   00:17 — ~19:17 CDT evening run  → trades TOMORROW's lows (main run)
#   03:17 — ~22:17 CDT late refresh → trades TOMORROW's lows
#   07:17 — ~02:17 CDT day-of run   → TODAY's lows, CT/MT/PT cities
#            (ET already past its 02:59-local stop; also avoids WU's
#            ~01 CT maintenance window)
#   08:47 — ~03:47 CDT day-of run   → MT (briefly) + PT cities
#
# Run-mode boundary lives in low_temp_trading.py: runs at/after 08:00 CT
# trade tomorrow's event; 00:00–07:59 CT runs are day-of with obs filters.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 3 * * *'
    - cron: '17 7 * * *'
    - cron: '47 8 * * *'
jobs:
  run-kalshi-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests cryptography google-cloud-bigquery db-dtypes pyarrow scipy pytz
    - name: Write secrets to disk
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      run: |
        echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > Lisa_Kalshi.txt
        printenv GCP_SA_KEY > google_credentials.json
    - name: Run Kalshi script
      id: run_script
      env:
        ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        ALERT_EMAIL_TO: jackdu224@gmail.com  # tmomail SMS gateway dead since 2026-06-29 -> deliver to inbox (Gmail push)
        GOOGLE_APPLICATION_CREDENTIALS: google_credentials.json
        # Probe-phase sizing — bump after the first weeks of KXLOW data.
        LOW_STARTING_CONTRACTS: "8"
        LOW_MAX_CONTRACTS: "50"
        # Tails stay off until a low-temp actual-vs-forecast error
        # distribution is built (cold busts are the fat tail for minima).
        TRADE_TAILS: "false"
      run: |
        set -o pipefail
        python low_temp_trading.py 2>&1 | tee run.log
    - name: Publish run summary
      if: always()
      env:
        JOB_STATUS: ${{ steps.run_script.outcome }}
      run: |
        {
          echo "*Outcome: \`$JOB_STATUS\`*"
          echo ""
          if [ -f run_summary.md ]; then
            cat run_summary.md
          else
            echo "_run_summary.md not produced — script may have failed early. See logs._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload run summary artifact
      if: always() && hashFiles('run_summary.md') != ''
      uses: actions/upload-artifact@v4
      with:
        name: low-temp-run-summary-${{ github.run_id }}
        path: run_summary.md
        retention-days: 30
    - name: Cleanup secrets
      if: always()
      run: |
        rm -f Lisa_Kalshi.txt google_credentials.json run.log run_summary.md
