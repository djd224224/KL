name: KXLOW pause enforcer
# Exchange-side backstop for the low-temp bot pause (2026-09-02): the
# repo-flag pause relies on the laptop syncing main, which failed silently —
# the bot quoted on Sep 1-3 with low_temp.paused live on main since Aug 31.
# While that flag exists, this cancels every resting KXLOW order at the
# exchange every 30 minutes, so anything the un-synced laptop places dies
# within ~half an hour of each trigger (20:17 / 23:17 / 03:17 / 04:47 ET).
# It touches ONLY KXLOW tickers — no other bot's orders.
#
# One switch: deleting low_temp.paused from main both resumes the bot AND
# makes this workflow a no-op. Remove or disable the workflow entirely once
# the laptop-side task is confirmed disabled or the pause is over.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kxlow_pause_enforcer.yml
      - cancel_kxlow_orders.py
concurrency:
  group: kxlow-pause-enforcer
  cancel-in-progress: false
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check pause flag
        id: flag
        run: |
          if [ -f low_temp.paused ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
            echo "low_temp.paused absent — nothing to enforce"
          fi
      - uses: actions/setup-python@v5
        if: steps.flag.outputs.paused == 'true'
        with:
          python-version: '3.x'
      - name: Install dependencies
        if: steps.flag.outputs.paused == 'true'
        run: pip install requests cryptography python-dateutil
      - name: Cancel resting KXLOW orders
        if: steps.flag.outputs.paused == 'true'
        env:
          KALSHI_PRIVATE_KEY_PATH: Lisa_Kalshi.txt
        run: |
          echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > Lisa_Kalshi.txt
          python cancel_kxlow_orders.py
      - name: Cleanup secrets
        if: always()
        run: rm -f Lisa_Kalshi.txt
